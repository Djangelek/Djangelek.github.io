<script>
  const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbypxUgCCiT1CRz5EwJDRH-A1YG1xBJDhB0DszlMIEcrVpbYH-r-91vQZqf8vJiw6Adp/exec";

  function enviarReporte() {
    const barco = document.getElementById('embarcacion').value;

    if (!barco) {
      showStatus("⚠️ Selecciona una embarcación.", "error");
      return;
    }

    showStatus("📡 Obteniendo posición...", "info");

    // Intenta usar la API de geolocalización
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const coords = `${position.coords.latitude}, ${position.coords.longitude}`;
          enviarAWebhook(coords);
        },
        (error) => {
          // Si estás en PC o el GPS falla, asigna un texto descriptivo o coords aproximadas
          console.warn("GPS no disponible:", error.message);
          enviarAWebhook("Posición PC / Sin GPS físico");
        },
        { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
      );
    } else {
      enviarAWebhook("Navegador sin soporte de geolocalización");
    }
  }

  function enviarAWebhook(coordenadasData) {
    showStatus("📤 Guardando reporte...", "info");

    const payload = {
      embarcacion: document.getElementById('embarcacion').value,
      estado: document.getElementById('estado').value,
      pasajeros: document.getElementById('pasajeros').value || 0,
      equipaje: document.getElementById('equipaje').value || 0,
      coordenadas: coordenadasData,
      notas: document.getElementById('notas').value
    };

    fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      showStatus("🎉 COMPLETADO CON ÉXITO", "success");
      document.getElementById('fleetForm').reset();
    })
    .catch(() => {
      showStatus("❌ Error de red. Intenta nuevamente.", "error");
    });
  }

  function showStatus(msg, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.innerText = msg;
    statusDiv.className = `status-${type}`;
  }
</script>
