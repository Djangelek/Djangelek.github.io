<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Flota - Navega Colombia</title>

  <!-- Fuente Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome (Íconos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet CSS (Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* --- VARIABLES DE COLOR Y RESET --- */
    :root {
      --bg-topbar: #00435b;
      --text-topbar: #ffffff;
      --accent-gold: #f5b729;
      --bg-footer: #ffffff;
      --text-footer: #333333;
      --border-footer: #e0e0e0;
      --bg-modal: #ffffff;
      --text-modal: #222222;
    }

    /* Tema Oscuro */
    body.dark-theme {
      --bg-topbar: #00222e;
      --bg-footer: #0f171c;
      --text-footer: #a0a0a0;
      --border-footer: #1f2d35;
      --bg-modal: #18242b;
      --text-modal: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    /* --- TOP BAR --- */
    .top-bar {
      background-color: var(--bg-topbar);
      color: var(--text-topbar);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      height: 65px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      height: 42px;
      width: auto;
      object-fit: contain;
      border-radius: 4px;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .info-section {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #2ecc71;
      border-radius: 50%;
      box-shadow: 0 0 8px #2ecc71;
    }

    .btn-settings {
      background: transparent;
      color: var(--accent-gold);
      border: 1.5px solid var(--accent-gold);
      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-settings:hover {
      background-color: var(--accent-gold);
      color: #00435b;
      transform: rotate(45deg);
    }

    /* --- CONTENEDOR DEL MAPA --- */
    .map-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* --- BOTTOM BAR --- */
    .bottom-bar {
      background-color: var(--bg-footer);
      color: var(--text-footer);
      text-align: center;
      padding: 8px 15px;
      font-size: 0.8rem;
      border-top: 1px solid var(--border-footer);
      z-index: 1000;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* --- MODAL DE CONFIGURACIÓN --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--bg-modal);
      color: var(--text-modal);
      width: 90%;
      max-width: 450px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      position: relative;
      transform: translateY(-20px);
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-footer);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-modal);
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.7;
    }

    .btn-close:hover {
      opacity: 1;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 10px 0;
    }

    /* Switch modo oscuro */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-gold);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .modal-actions {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-action {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: #00435b;
      color: white;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-action.gold {
      background-color: var(--accent-gold);
      color: #00435b;
    }

    /* Ocultar texto informativo en pantallas muy pequeñas */
    @media (max-width: 480px) {
      .info-section span {
        display: none;
      }
      .app-title {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="brand-section">
      <img src="images.jpg" alt="Logo Navega Colombia" class="logo">
      <h1 class="app-title">Control de Flota</h1>
    </div>

    <div class="info-section">
      <div class="status-dot"></div>
      <span>Seguimiento en Vivo</span>
    </div>

    <button id="btn-config" class="btn-settings" title="Ajustes">
      <i class="fa-solid fa-gear"></i>
    </button>
  </header>

  <!-- CONTENEDOR DEL MAPA -->
  <main class="map-wrapper">
    <div id="map"></div>
  </main>

  <!-- BOTTOM BAR -->
  <footer class="bottom-bar">
    <p>&copy; 2026 Navega Colombia. Todos los derechos reservados.</p>
  </footer>

  <!-- MODAL DE CONFIGURACIÓN -->
  <div id="config-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2><i class="fa-solid fa-sliders"></i> Configuración</h2>
        <button id="btn-close-modal" class="btn-close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body">
        <div class="setting-item">
          <span>Modo Oscuro</span>
          <label class="switch">
            <input type="checkbox" id="toggle-dark-mode">
            <span class="slider"></span>
          </label>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-footer); margin: 15px 0;">

        <div class="modal-actions">
          <a href="https://docs.google.com/spreadsheets/d/1UKFOp1K8YFFE9VMLhTi3iJIH5rEHve-9ZWx_-Dke35s/edit" target="_blank" class="btn-action gold">
            <i class="fa-solid fa-file-excel"></i> Editar Excel de Embarcaciones
          </a>
          <button id="btn-refresh" class="btn-action">
            <i class="fa-solid fa-rotate"></i> Actualizar Posiciones
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- LEAFLET JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- PAPAPARSE (Para leer el CSV de Google Sheets) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // 1. INICIALIZACIÓN DEL MAPA
    // Coordenadas iniciales centrándose en la Bahía de Cartagena
    const map = L.map('map').setView([10.4000, -75.5300], 12);

    // Capas de mapa (Claro y Oscuro)
    const lightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    });

    const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    });

    // Iniciar con mapa claro por defecto
    lightTiles.addTo(map);

    // 2. LÓGICA DEL MODAL Y AJUSTES
    const btnConfig = document.getElementById('btn-config');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const configModal = document.getElementById('config-modal');
    const toggleDarkMode = document.getElementById('toggle-dark-mode');
    const btnRefresh = document.getElementById('btn-refresh');

    // Abrir Modal
    btnConfig.addEventListener('click', () => {
      configModal.classList.add('active');
    });

    // Cerrar Modal
    btnCloseModal.addEventListener('click', () => {
      configModal.classList.remove('active');
    });

    // Cerrar modal al hacer clic fuera de la tarjeta
    configModal.addEventListener('click', (e) => {
      if (e.target === configModal) {
        configModal.classList.remove('active');
      }
    });

    // 3. CAMBIO DE MODO OSCURO (UI + MAPA)
    toggleDarkMode.addEventListener('change', (e) => {
      if (e.target.checked) {
        document.body.classList.add('dark-theme');
        map.removeLayer(lightTiles);
        darkTiles.addTo(map);
      } else {
        document.body.classList.remove('dark-theme');
        map.removeLayer(darkTiles);
        lightTiles.addTo(map);
      }
    });

    // 4. ACCIÓN DE ACTUALIZAR POSICIONES
    btnRefresh.addEventListener('click', () => {
      configModal.classList.remove('active');
      // Aquí puedes llamar a tu función existente de PapaParse para recargar los puntos
      alert('Actualizando mapa desde Google Sheets...');
    });
  </script>
</body>
</html>
