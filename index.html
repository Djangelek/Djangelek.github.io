<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control Flota Náutica - Cartagena</title>

  <!-- 1. Carga asíncrona del CSS del mapa (Optimización de velocidad) -->
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  </noscript>

  <!-- 2. Carga del archivo de Configuración (Debe estar en la misma carpeta) -->
  <script src="api_config.js"></script>

  <!-- 3. Librerías diferidas (Se cargan en 2do plano sin bloquear la página) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js" defer></script>

  <style>
    :root {
      --bg: #0f172a;
      --header-height: 84px;
      --card: #1e293b;
      --text: #f8fafc;
      --border: #334155;
      --primary: #38bdf8;
      --primary-active: #0284c7;
      --success-bg: #064e3b;
      --success-text: #6ee7b7;
      --error-bg: #7f1d1d;
      --error-text: #fca5a5;
      --info-bg: #0c4a6e;
      --info-text: #7dd3fc;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .nav-tabs,
    .container,
    .site-header,
    .site-footer {
      width: 100%;
      max-width: 1260px;
    }

    .nav-tabs {
      display: flex;
      margin-bottom: 14px;
      background: var(--card);
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .tab-btn {
      flex: 1;
      padding: 13px;
      border: none;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #0f172a;
    }

    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 22px 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    #reporteTab form {
      max-width: 620px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 1.25rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 800;
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    select,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      font-size: 1rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      outline: none;
      appearance: none;
    }

    input:disabled {
      opacity: 0.4;
      background-color: #1e293b;
      cursor: not-allowed;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      background: var(--bg);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .checkbox-container input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-container span {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .grid-3 {
        gap: 8px;
      }

      .grid-3 label {
        font-size: 0.78rem;
      }

      .grid-3 input {
        padding: 0 8px;
        font-size: 0.95rem;
      }
    }

    .btn-submit {
      width: 100%;
      height: 56px;
      margin-top: 22px;
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover:not(:disabled) {
      opacity: 0.95;
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      background-color: #334155;
      color: #94a3b8;
    }

    #status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      text-align: center;
      font-size: 0.95rem;
      display: none;
      max-width: 620px;
      margin-left: auto;
      margin-right: auto;
    }

    .status-info {
      background: var(--info-bg);
      color: var(--info-text);
      display: block !important;
    }

    .status-success {
      background: var(--success-bg);
      color: var(--success-text);
      display: block !important;
      border: 2px solid var(--success-text);
    }

    .status-error {
      background: var(--error-bg);
      color: var(--error-text);
      display: block !important;
    }

    /* DASHBOARD */
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .dashboard-header h2 {
      margin: 0;
      text-align: left;
      font-size: 1.25rem;
    }

    .fleet-counter-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .dashboard-controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (min-width: 600px) {
      .dashboard-controls {
        grid-template-columns: 1fr auto;
      }
    }

    .map-selector {
      height: 46px;
      padding: 0 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 10px;
      border: 2px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .btn-refresh {
      height: 46px;
      min-width: 180px;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .btn-refresh:hover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
    }

    .dashboard-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #map {
      width: 100%;
      height: clamp(340px, 48vh, 440px);
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #0b1329;
      z-index: 1;
    }

    .fleet-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 900px) {
      .dashboard-layout {
        flex-direction: row;
        align-items: stretch;
        gap: 20px;
      }

      #map {
        flex: 1.6;
        height: calc(100vh - 280px);
        min-height: 520px;
      }

      .fleet-list {
        flex: 1;
        max-height: calc(100vh - 280px);
        min-height: 520px;
        overflow-y: auto;
        padding-right: 6px;
      }
    }

    .fleet-list::-webkit-scrollbar {
      width: 6px;
    }

    .fleet-list::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 4px;
    }

    .fleet-list::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    .fleet-list::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .boat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
    }

    .boat-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .boat-card.active {
      border-color: var(--primary);
      border-left-width: 5px;
      background: rgba(56, 189, 248, 0.12);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .boat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-right: 32px;
      gap: 8px;
    }

    .boat-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-badge.status-navigating {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .status-badge.status-anchored {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .status-badge.status-docked {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .status-badge.status-tour {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }

    .status-badge.status-maintenance {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .status-badge.status-weather {
      background: rgba(129, 140, 248, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.35);
    }

    .status-badge.status-fuel {
      background: rgba(251, 146, 60, 0.15);
      color: #fb923c;
      border: 1px solid rgba(251, 146, 60, 0.35);
    }

    .status-badge.status-cleaning {
      background: rgba(45, 212, 191, 0.15);
      color: #2dd4bf;
      border: 1px solid rgba(45, 212, 191, 0.35);
    }

    .status-badge.status-default {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .boat-place {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .boat-info {
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      gap: 14px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .boat-time {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 4px;
    }

    .btn-delete {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--error-bg);
      color: var(--error-text);
      border: none;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-delete:hover {
      transform: scale(1.1);
      background: #991b1b;
    }

    /* HEADER Y FOOTER */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      margin: 0 auto 14px auto;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.08), rgba(2, 132, 199, 0.05));
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.45);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    .site-header img {
      height: 60px;
      width: auto;
      border-radius: 10px;
      display: block;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    }

    .site-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-brand .brand-name {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1;
      letter-spacing: 0.6px;
    }

    .site-brand .brand-tag {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 700;
    }

    .btn-pc-settings {
      display: none;
    }

    @media (min-width: 992px) {
      .btn-pc-settings {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(56, 189, 248, 0.25);
        color: #94a3b8;
        padding: 7px 13px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        opacity: 0.35;
        transition: opacity 0.25s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      }

      .btn-pc-settings:hover {
        opacity: 1;
        color: #38bdf8;
        background: rgba(15, 23, 42, 0.95);
        border-color: #38bdf8;
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
        transform: translateY(-50%) scale(1.03);
      }

      .btn-pc-settings svg {
        transition: transform 0.4s ease;
      }

      .btn-pc-settings:hover svg {
        transform: rotate(90deg);
      }
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(56, 189, 248, 0.15);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid #334155;
      background: #0f172a;
    }

    .modal-title-group h3 {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .modal-title-group p {
      margin: 3px 0 0 0;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.6rem;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .modal-close-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-nav {
      display: flex;
      padding: 8px 20px;
      background: #131d2e;
      border-bottom: 1px solid #334155;
      gap: 6px;
    }

    .modal-nav-tab {
      padding: 9px 15px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-nav-tab.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-tab-content {
      display: none;
    }

    .modal-tab-content.active {
      display: block;
    }

    .cfg-add-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .cfg-add-bar input {
      flex: 1;
      height: 44px;
      padding: 0 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-cfg-add {
      height: 44px;
      padding: 0 16px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .cfg-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .cfg-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      gap: 10px;
    }

    .cfg-item-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: #f8fafc;
    }

    .btn-cfg-item-delete {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    #cfgJsonEditor {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #a5f3fc;
      font-family: monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      resize: vertical;
      outline: none;
    }

    .cfg-json-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-cfg-secondary {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      gap: 6px;
    }

    .btn-cfg-danger {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      padding: 14px 22px;
      border-top: 1px solid #334155;
      background: #0f172a;
    }

    .cfg-modal-alert {
      font-size: 0.83rem;
      font-weight: 700;
      display: none;
    }

    .cfg-modal-alert.alert-success {
      color: #6ee7b7;
      display: block;
    }

    .cfg-modal-alert.alert-error {
      color: #fca5a5;
      display: block;
    }

    .btn-cfg-cancel {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cfg-save {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .site-header img {
        height: 46px;
      }

      .site-brand .brand-name {
        font-size: 1.1rem;
      }
    }

    .site-footer {
      margin-top: 20px;
      padding: 12px 14px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .fixed-dot .dot {
      display: block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.9);
    }

    .leaflet-popup-content-wrapper {
      padding: 0 !important;
      background: #1e293b !important;
      border: 1px solid #334155 !important;

<body>

  <header class="site-header" role="banner">
    <div class="site-brand">
      <img src="images.webp" alt="Colombia Navega logo" />
      <div>
        <div class="brand-name">Colombia Navega</div>
        <div class="brand-tag">Control Flota Náutica</div>
      </div>
    </div>
    <button id="btnPcSettings" class="btn-pc-settings" onclick="openConfigModal()"
      title="Configuración de Barcos y Estados (Solo PC - Ctrl+Shift+S)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
      </svg>
      <span>Configuración</span>
    </button>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('reporteTab', this)">REPORTAR</button>
    <button class="tab-btn" onclick="switchTab('dashboardTab', this)">MAPA NÁUTICO</button>
  </div>

  <div class="container">

    <!-- FORMULARIO DE REPORTE -->
    <div id="reporteTab" class="tab-content active">
      <h2>Reporte Operativo</h2>
      <form id="fleetForm">

        <label for="embarcacion">Embarcacion / Yate</label>
        <select id="embarcacion" onchange="cargarUltimoPaxEquipaje()" required>
          <option value="" disabled selected>Seleccione embarcación...</option>
        </select>

        <label for="estado">Estado / Actividad</label>
        <select id="estado" required></select>

        <label for="notas">Lugar / Referencia</label>
        <input type="text" id="notas" placeholder="Ej: Isla Grande / Cholon">

        <div class="grid-3">
          <div>
            <label for="pasajeros">Pasajeros</label>
            <input type="number" id="pasajeros" inputmode="numeric" placeholder="0">
          </div>
          <div>
            <label for="maletas">Maletas</label>
            <input type="number" id="maletas" inputmode="numeric" placeholder="0">
          </div>
          <div>
            <label for="bolsos">Bolsos</label>
            <input type="number" id="bolsos" inputmode="numeric" placeholder="0">
          </div>
        </div>

        <label class="checkbox-container">
          <input type="checkbox" id="repetirPax" onchange="togglePaxEquipaje(this.checked)">
          <span>Usar Pasajeros, maletas y bolsos del reporte anterior</span>
        </label>

        <button type="button" id="btnSubmit" class="btn-submit" onclick="enviarReporte()">ENVIAR REPORTE</button>
      </form>
      <div id="status"></div>
    </div>

    <!-- DASHBOARD MAPA -->
    <div id="dashboardTab" class="tab-content">
      <div class="dashboard-header">
        <h2>Radar & Estado de Flota</h2>
        <span id="fleetCountBadge" class="fleet-counter-badge">⚓ Cargando flota...</span>
      </div>
      <div class="dashboard-controls">
        <select id="mapBoatSelector" class="map-selector" onchange="onSelectBoatFilter(this.value)">
          <option value="ALL">📍 Mostrar todos los barcos</option>
        </select>
        <button id="btnRefresh" class="btn-refresh" onclick="cargarMapa()">🔄 Actualizar Posiciones</button>
      </div>

      <div class="dashboard-layout">
        <div id="map"></div>
        <div id="fleetList" class="fleet-list">
          <div style="text-align: center; color: #64748b; padding: 20px;">Cargando posiciones...</div>
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL DE CONFIGURACIÓN -->
  <div id="configModalOverlay" class="modal-overlay" onclick="closeConfigModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title-group">
          <h3>⚙️ Configuración del Sistema</h3>
          <p>Administración de barcos y estados</p>
        </div>
        <button class="modal-close-btn" onclick="closeConfigModal()" title="Cerrar">&times;</button>
      </div>

      <div class="modal-nav">
        <button class="modal-nav-tab active" onclick="switchConfigModalTab('cfgBarcosTab', this)">🛥️ Barcos (<span
            id="cfgBarcosCount">0</span>)</button>
        <button class="modal-nav-tab" onclick="switchConfigModalTab('cfgEstadosTab', this)">🏷️ Estados (<span
            id="cfgEstadosCount">0</span>)</button>
        <button class="modal-nav-tab" onclick="switchConfigModalTab('cfgJsonTab', this)">💾 Archivo JSON</button>
      </div>

      <div class="modal-body">
        <div id="cfgBarcosTab" class="modal-tab-content active">
          <div class="cfg-add-bar">
            <input type="text" id="newBoatInput" placeholder="Nombre de nueva embarcación..."
              onkeydown="if(event.key==='Enter'){event.preventDefault();addNewBoat();}">
            <button type="button" class="btn-cfg-add" onclick="addNewBoat()">+ Agregar</button>
          </div>
          <div class="cfg-list-container" id="cfgBoatsList"></div>
        </div>

        <div id="cfgEstadosTab" class="modal-tab-content">
          <div class="cfg-add-bar">
            <input type="text" id="newStatusInput" placeholder="Ej: ⚓ En destino..."
              onkeydown="if(event.key==='Enter'){event.preventDefault();addNewStatus();}">
            <button type="button" class="btn-cfg-add" onclick="addNewStatus()">+ Agregar</button>
          </div>
          <div class="cfg-list-container" id="cfgStatusList"></div>
        </div>

        <div id="cfgJsonTab" class="modal-tab-content">
          <p class="cfg-hint">Edita el JSON directamente, descárgalo, cópialo o importa un archivo .json de respaldo.
          </p>
          <textarea id="cfgJsonEditor" rows="10" spellcheck="false"></textarea>
          <div class="cfg-json-actions">
            <button type="button" class="btn-cfg-secondary" onclick="applyJsonFromEditor()">⚡ Aplicar JSON
              editado</button>
            <button type="button" class="btn-cfg-secondary" onclick="downloadConfigFile()">📥 Descargar
              config.json</button>
            <button type="button" class="btn-cfg-secondary" onclick="copyJsonToClipboard()">📋 Copiar JSON</button>
            <label class="btn-cfg-secondary file-upload-label">
              📂 Importar config.json
              <input type="file" id="cfgFileInput" accept=".json" style="display: none;"
                onchange="importConfigFile(event)">
            </label>
          </div>
          <div
            style="margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; justify-content: flex-end;">
            <button type="button" class="btn-cfg-danger" onclick="resetToDefaultConfig()">⚠️ Restaurar valores por
              defecto</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div id="cfgModalAlert" class="cfg-modal-alert"></div>
        <div class="modal-footer-btns">
          <button type="button" class="btn-cfg-cancel" onclick="closeConfigModal()">Cerrar</button>
          <button type="button" class="btn-cfg-save" onclick="saveAndApplyConfig()">💾 Guardar y Aplicar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div>Colombia Navega &copy; <span id="year"></span></div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // =============== INICIALIZACIÓN SÍNCRONA RÁPIDA ===============
    // Llama directamente a la función declarada en api_config.js
    let activeConfig = window.obtenerConfiguracion ? window.obtenerConfiguracion() : { barcos: [], estados: [] };

    let map;
    let markersGroup;
    const markersMap = {};
    let ultimosReportesGlobal = {};

    // Carga los desplegables de inmediato para que el usuario no espere nada
    renderConfigSelects();

    function renderConfigSelects() {
      const selectBarco = document.getElementById('embarcacion');
      const selectEstado = document.getElementById('estado');
      if (!selectBarco || !selectEstado) return;

      const currentSelectedBoat = selectBarco.value;
      const currentSelectedState = selectEstado.value;

      selectBarco.innerHTML = '<option value="" disabled selected>Selecciona barco...</option>';
      selectEstado.innerHTML = '';

      if (activeConfig.barcos) {
        activeConfig.barcos.forEach(barco => {
          if (barco && barco.trim() !== '') {
            const opt = document.createElement('option');
            opt.value = barco.trim();
            opt.textContent = barco.trim();
            if (barco.trim() === currentSelectedBoat) opt.selected = true;
            selectBarco.appendChild(opt);
          }
        });
      }

      if (activeConfig.estados) {
        activeConfig.estados.forEach(estado => {
          if (estado && estado.trim() !== '') {
            const opt = document.createElement('option');
            opt.value = estado.trim();
            opt.textContent = estado.trim();
            if (estado.trim() === currentSelectedState) opt.selected = true;
            selectEstado.appendChild(opt);
          }
        });
      }
    }
    // ==============================================================

    function getStatusBadgeClass(estado) {
      if (!estado) return 'status-default';
      const s = estado.toLowerCase();
      if (s.includes('panoram') || s.includes('foto') || s.includes('turism')) return 'status-tour';
      if (s.includes('tiempo') || s.includes('refugi') || s.includes('torment') || s.includes('clima')) return 'status-weather';
      if (s.includes('tanque') || s.includes('abastec') || s.includes('combust')) return 'status-fuel';
      if (s.includes('limp') || s.includes('prepar')) return 'status-cleaning';
      if (s.includes('manten') || s.includes('varad') || s.includes('fuera') || s.includes('inactiv') || s.includes('dañ') || s.includes('servicio')) return 'status-maintenance';
      if (s.includes('transito') || s.includes('tránsito') || s.includes('rumbo') || s.includes('pasando') || s.includes('naveg') || s.includes('viaje')) return 'status-navigating';
      if (s.includes('arribad') || s.includes('destino') || s.includes('fond') || s.includes('anc') || s.includes('isla') || s.includes('espera')) return 'status-anchored';
      if (s.includes('amarre') || s.includes('muelle') || s.includes('puerto') || s.includes('marina') || s.includes('embarque')) return 'status-docked';
      return 'status-default';
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'dashboardTab') {
        setTimeout(() => {
          if (typeof L === 'undefined' || typeof Papa === 'undefined') {
            showStatus("Cargando librerías del mapa... Intenta de nuevo en unos segundos.", "info");
            return;
          }
          if (!map) {
            initMap();
          } else {
            map.invalidateSize();
          }
          cargarMapa();
        }, 200);
      }
    }

    let tempModalConfig = null;

    function openConfigModal() {
      tempModalConfig = JSON.parse(JSON.stringify(activeConfig));
      renderModalConfigLists();
      updateJsonEditor();
      document.getElementById('configModalOverlay').classList.add('active');
    }

    function closeConfigModal(e) {
      if (e && e.target && e.target.id !== 'configModalOverlay' && !e.target.classList.contains('modal-close-btn') && !e.target.classList.contains('btn-cfg-cancel')) {
        return;
      }
      document.getElementById('configModalOverlay').classList.remove('active');
      clearCfgAlert();
    }

    function switchConfigModalTab(tabId, btn) {
      document.querySelectorAll('.modal-tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.modal-nav-tab').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'cfgJsonTab') updateJsonEditor();
    }

    function renderModalConfigLists() {
      if (!tempModalConfig) return;

      document.getElementById('cfgBarcosCount').textContent = tempModalConfig.barcos.length;
      document.getElementById('cfgEstadosCount').textContent = tempModalConfig.estados.length;

      const boatsContainer = document.getElementById('cfgBoatsList');
      boatsContainer.innerHTML = '';
      if (tempModalConfig.barcos.length === 0) {
        boatsContainer.innerHTML = '<div style="color: #64748b; font-size: 0.85rem; padding: 10px; text-align: center;">No hay barcos agregados.</div>';
      } else {
        tempModalConfig.barcos.forEach((barco, index) => {
          const item = document.createElement('div');
          item.className = 'cfg-item';
          item.innerHTML = `
            <span class="cfg-item-title">🛥️ ${escapeHtml(barco)}</span>
            <div class="cfg-item-actions">
              <button type="button" class="btn-cfg-item-delete" onclick="deleteModalBoat(${index})" title="Eliminar barco">🗑️</button>
            </div>
          `;
          boatsContainer.appendChild(item);
        });
      }

      const statusContainer = document.getElementById('cfgStatusList');
      statusContainer.innerHTML = '';
      if (tempModalConfig.estados.length === 0) {
        statusContainer.innerHTML = '<div style="color: #64748b; font-size: 0.85rem; padding: 10px; text-align: center;">No hay estados agregados.</div>';
      } else {
        tempModalConfig.estados.forEach((estado, index) => {
          const item = document.createElement('div');
          item.className = 'cfg-item';
          item.innerHTML = `
            <span class="cfg-item-title">${escapeHtml(estado)}</span>
            <div class="cfg-item-actions">
              <button type="button" class="btn-cfg-item-delete" onclick="deleteModalStatus(${index})" title="Eliminar estado">🗑️</button>
            </div>
          `;
          statusContainer.appendChild(item);
        });
      }
    }

    function addNewBoat() {
      const input = document.getElementById('newBoatInput');
      const val = input.value.trim();
      if (!val) return;
      if (tempModalConfig.barcos.some(b => b.toLowerCase() === val.toLowerCase())) {
        showCfgAlert('Este barco ya existe.', 'error');
        return;
      }
      tempModalConfig.barcos.push(val);
      input.value = '';
      renderModalConfigLists();
      showCfgAlert(`Barco "${val}" agregado. Haz clic en "Guardar y Aplicar".`, 'success');
    }

    function deleteModalBoat(index) {
      const removed = tempModalConfig.barcos.splice(index, 1);
      renderModalConfigLists();
      showCfgAlert(`Barco "${removed[0]}" eliminado. Haz clic en "Guardar y Aplicar".`, 'success');
    }

    function addNewStatus() {
      const input = document.getElementById('newStatusInput');
      const val = input.value.trim();
      if (!val) return;
      if (tempModalConfig.estados.some(s => s.toLowerCase() === val.toLowerCase())) {
        showCfgAlert('Este estado ya existe.', 'error');
        return;
      }
      tempModalConfig.estados.push(val);
      input.value = '';
      renderModalConfigLists();
      showCfgAlert(`Estado "${val}" agregado. Haz clic en "Guardar y Aplicar".`, 'success');
    }

    function deleteModalStatus(index) {
      const removed = tempModalConfig.estados.splice(index, 1);
      renderModalConfigLists();
      showCfgAlert(`Estado "${removed[0]}" eliminado. Haz clic en "Guardar y Aplicar".`, 'success');
    }

    function updateJsonEditor() {
      if (!tempModalConfig) return;
      document.getElementById('cfgJsonEditor').value = JSON.stringify(tempModalConfig, null, 2);
    }

    function applyJsonFromEditor() {
      try {
        const parsed = JSON.parse(document.getElementById('cfgJsonEditor').value);
        if (!parsed || !Array.isArray(parsed.barcos) || !Array.isArray(parsed.estados)) {
          throw new Error('El JSON debe contener las listas "barcos" y "estados".');
        }
        tempModalConfig = parsed;
        renderModalConfigLists();
        showCfgAlert('JSON validado y aplicado temporalmente.', 'success');
      } catch (err) {
        showCfgAlert('Error en JSON: ' + err.message, 'error');
      }
    }

    function downloadConfigFile() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tempModalConfig || activeConfig, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "config.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showCfgAlert('Archivo config.json descargado.', 'success');
    }

    function copyJsonToClipboard() {
      navigator.clipboard.writeText(JSON.stringify(tempModalConfig || activeConfig, null, 2))
        .then(() => showCfgAlert('¡JSON copiado al portapapeles!', 'success'))
        .catch(() => showCfgAlert('No se pudo copiar.', 'error'));
    }

    function importConfigFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.barcos) || !Array.isArray(parsed.estados)) {
            throw new Error('Formato inválido.');
          }
          tempModalConfig = parsed;
          renderModalConfigLists();
          updateJsonEditor();
          showCfgAlert('Importado con éxito. Haz clic en "Guardar y Aplicar".', 'success');
        } catch (err) {
          showCfgAlert('Error al importar: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function resetToDefaultConfig() {
      if (confirm('¿Restablecer los barcos y estados por defecto? (Se borrarán tus cambios)')) {
        // Se resetea desde la variable global si api_config.js está bien cargado
        tempModalConfig = typeof DEFAULT_CONFIG !== 'undefined' ? JSON.parse(JSON.stringify(DEFAULT_CONFIG)) : { barcos: [], estados: [] };
        renderModalConfigLists();
        updateJsonEditor();
        showCfgAlert('Valores por defecto cargados. Haz clic en "Guardar y Aplicar".', 'success');
      }
    }

    function saveAndApplyConfig() {
      if (!tempModalConfig) return;
      activeConfig = JSON.parse(JSON.stringify(tempModalConfig));
      try {
        localStorage.setItem('colombia_navega_config', JSON.stringify(activeConfig));
      } catch (e) {
        console.warn('Error guardando en localStorage:', e);
      }
      renderConfigSelects();
      showCfgAlert('¡Configuración guardada y aplicada!', 'success');
      setTimeout(() => closeConfigModal(), 600);
    }

    function showCfgAlert(msg, type) {
      const alertElem = document.getElementById('cfgModalAlert');
      if (!alertElem) return;
      alertElem.textContent = msg;
      alertElem.className = 'cfg-modal-alert alert-' + type;
    }

    function clearCfgAlert() {
      const alertElem = document.getElementById('cfgModalAlert');
      if (alertElem) alertElem.textContent = '';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('keydown', function (e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')) {
        e.preventDefault();
        openConfigModal();
      }
    });

    function togglePaxEquipaje(checked) {
      const inputPax = document.getElementById('pasajeros');
      const inputMaletas = document.getElementById('maletas');
      const inputBolsos = document.getElementById('bolsos');
      inputPax.disabled = checked;
      inputMaletas.disabled = checked;
      inputBolsos.disabled = checked;

      if (checked) {
        if (typeof Papa === 'undefined') {
          showStatus("Cargando conexión con base de datos, intenta en un momento.", "info");
          document.getElementById('repetirPax').checked = false;
          inputPax.disabled = false; inputMaletas.disabled = false; inputBolsos.disabled = false;
          return;
        }

        if (Object.keys(ultimosReportesGlobal).length === 0 && typeof CSV_SHEET_URL !== 'undefined') {
          Papa.parse(CSV_SHEET_URL + "&t=" + new Date().getTime(), {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function (results) {
              results.data.forEach(row => {
                const keys = Object.keys(row);
                const barcoKey = keys.find(k => k.toLowerCase().includes('embarcacion'));
                if (barcoKey && row[barcoKey] && row[barcoKey].trim() !== '') {
                  ultimosReportesGlobal[row[barcoKey].trim()] = row;
                }
              });
              cargarUltimoPaxEquipaje();
            }
          });
        } else {
          cargarUltimoPaxEquipaje();
        }
      }
    }

    function cargarUltimoPaxEquipaje() {
      const barco = document.getElementById('embarcacion').value;
      const checkbox = document.getElementById('repetirPax');

      if (checkbox.checked && barco && ultimosReportesGlobal[barco]) {
        const item = ultimosReportesGlobal[barco];
        const keys = Object.keys(item);
        document.getElementById('pasajeros').value = item[keys.find(k => k.toLowerCase().includes('pasajeros'))] || 0;
        document.getElementById('maletas').value = item[keys.find(k => k.toLowerCase().includes('maletas') || k.toLowerCase().includes('equipaje'))] || 0;
        document.getElementById('bolsos').value = item[keys.find(k => k.toLowerCase().includes('bolsos'))] || 0;
      }
    }

    function enviarReporte() {
      const barco = document.getElementById('embarcacion').value;
      const btn = document.getElementById('btnSubmit');

      if (!barco) {
        showStatus("Selecciona una embarcación.", "error");
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '🛰️ Obteniendo GPS...';
      }
      showStatus("Obteniendo precisión de GPS...", "info");

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            if (btn) btn.innerHTML = '⏳ Enviando reporte...';
            enviarAWebhook(`${pos.coords.latitude}, ${pos.coords.longitude}`, "insert");
          },
          (err) => {
            console.warn("GPS no disponible:", err);
            if (btn) btn.innerHTML = '⏳ Enviando reporte...';
            enviarAWebhook("Posicion no disponible", "insert");
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
      } else {
        if (btn) btn.innerHTML = '⏳ Enviando reporte...';
        enviarAWebhook("Navegador sin soporte GPS", "insert");
      }
    }

    function enviarAWebhook(coordsOrData, action = "insert") {
      const btn = document.getElementById('btnSubmit');
      showStatus("Procesando...", "info");

      let payload = {};
      if (action === "insert") {
        const maletasVal = document.getElementById('maletas').value || 0;
        payload = {
          action: "insert",
          embarcacion: document.getElementById('embarcacion').value,
          estado: document.getElementById('estado').value,
          pasajeros: document.getElementById('pasajeros').value || 0,
          maletas: maletasVal,
          equipaje: maletasVal,
          bolsos: document.getElementById('bolsos').value || 0,
          coordenadas: coordsOrData,
          notas: document.getElementById('notas').value
        };
      } else if (action === "delete") {
        payload = { action: "delete", embarcacion: coordsOrData };
      }

      if (typeof WEBHOOK_URL === 'undefined') {
        showStatus("Falta configurar la URL del Webhook en api_config.js.", "error");
        if (btn) { btn.disabled = false; btn.innerHTML = 'ENVIAR REPORTE'; }
        return;
      }

      fetch(WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(() => {
          showStatus("COMPLETADO CON ÉXITO", "success");
          if (action === "insert") {
            document.getElementById('fleetForm').reset();
            document.getElementById('repetirPax').checked = false;
            togglePaxEquipaje(false);
          }
          if (typeof cargarMapa === "function" && document.getElementById('dashboardTab').classList.contains('active')) {
            setTimeout(() => cargarMapa(), 1500);
          }
        })
        .catch(() => showStatus("Error de red.", "error"))
        .finally(() => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = 'ENVIAR REPORTE';
          }
        });
    }

    function eliminarBarcoEvent(e, barcoNombre) {
      e.stopPropagation();
      if (confirm(`¿Estás seguro de que deseas ELIMINAR TODOS los reportes de ${barcoNombre}?`)) {
        enviarAWebhook(barcoNombre, "delete");
      }
    }

    function showStatus(msg, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = msg;
      statusDiv.className = `status-${type}`;
    }

    function initMap() {
      map = L.map('map', { zoomAnimation: true, fadeAnimation: true, markerZoomAnimation: true }).setView([10.4000, -75.5300], 11);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, subdomains: 'abcd', attribution: '&copy; CARTO'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
      setTimeout(() => map.invalidateSize(), 300);

      map.on('zoomend', () => updatePopupScale());
      updatePopupScale();
    }

    function updatePopupScale() {
      if (!map) return;
      const z = map.getZoom();
      let scale = Math.max(0.85, Math.min(1.08, 1 + (z - 11) * 0.035));
      document.documentElement.style.setProperty('--popup-scale', scale);
    }

    function cargarMapa() {
      const btnRefresh = document.getElementById('btnRefresh');
      if (btnRefresh) {
        btnRefresh.disabled = true;
        btnRefresh.innerHTML = '⏳ Actualizando...';
      }

      if (typeof Papa === 'undefined' || typeof CSV_SHEET_URL === 'undefined') {
        if (btnRefresh) { btnRefresh.disabled = false; btnRefresh.innerHTML = '🔄 Actualizar Posiciones'; }
        return;
      }

      Papa.parse(CSV_SHEET_URL + "&t=" + new Date().getTime(), {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {
          if (btnRefresh) {
            btnRefresh.disabled = false;
            btnRefresh.innerHTML = '🔄 Actualizar Posiciones';
          }
          if (markersGroup) markersGroup.clearLayers();
          for (let key in markersMap) delete markersMap[key];

          const fleetListDiv = document.getElementById('fleetList');
          if (fleetListDiv) fleetListDiv.innerHTML = '';

          const selectorElem = document.getElementById('mapBoatSelector');
          if (selectorElem) selectorElem.innerHTML = '<option value="ALL">📍 Mostrar todos los barcos</option>';

          ultimosReportesGlobal = {};

          results.data.forEach(row => {
            const keys = Object.keys(row);
            const barcoKey = keys.find(k => k.toLowerCase().includes('embarcacion'));
            if (barcoKey && row[barcoKey] && row[barcoKey].trim() !== '') {
              ultimosReportesGlobal[row[barcoKey].trim()] = row;
            }
          });

          const listItems = Object.values(ultimosReportesGlobal);
          cargarUltimoPaxEquipaje();

          const countBadge = document.getElementById('fleetCountBadge');
          if (countBadge) countBadge.textContent = `⚓ ${listItems.length} embarcacion${listItems.length === 1 ? '' : 'es'}`;

          if (!fleetListDiv) return;

          if (listItems.length === 0) {
            fleetListDiv.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">No hay reportes registrados.</div>';
            return;
          }

          listItems.forEach(item => {
            const keys = Object.keys(item);
            const barco = item[keys.find(k => k.toLowerCase().includes('embarcacion'))] || 'Sin Nombre';
            const estado = item[keys.find(k => k.toLowerCase().includes('estado'))] || 'N/A';
            const pax = item[keys.find(k => k.toLowerCase().includes('pasajeros'))] || 0;
            const maletas = item[keys.find(k => k.toLowerCase().includes('maletas') || k.toLowerCase().includes('equipaje'))] || 0;
            const bolsos = item[keys.find(k => k.toLowerCase().includes('bolsos'))] || 0;
            const lugar = item[keys.find(k => k.toLowerCase().includes('notas'))] || 'Sin ubicación';
            const fecha = item[keys.find(k => k.toLowerCase().includes('fecha'))] || '';
            const rawCoords = item[keys.find(k => k.toLowerCase().includes('coordenadas'))] || '';
            const statusBadgeClass = getStatusBadgeClass(estado);

            let lat = null, lng = null;
            if (rawCoords && rawCoords.includes(',')) {
              const parts = rawCoords.split(',');
              const parsedLat = parseFloat(parts[0].trim());
              const parsedLng = parseFloat(parts[1].trim());
              if (!isNaN(parsedLat) && !isNaN(parsedLng) && (Math.abs(parsedLat) > 0.001 || Math.abs(parsedLng) > 0.001) && Math.abs(parsedLat) <= 90 && Math.abs(parsedLng) <= 180) {
                lat = parsedLat; lng = parsedLng;
              }
            }

            if (selectorElem && barco !== 'Sin Nombre') {
              const opt = document.createElement('option');
              opt.value = barco;
              const gpsNote = (lat !== null && lng !== null) ? '' : ' - (Sin GPS)';
              opt.textContent = `🛥️ ${barco} (${estado})${gpsNote}`;
              selectorElem.appendChild(opt);
            }

            if (map && lat !== null && lng !== null) {
              const icon = L.divIcon({ className: 'fixed-dot', html: '<span class="dot"></span>', iconSize: [14, 14], iconAnchor: [7, 7] });
              const marker = L.marker([lat, lng], { icon: icon, riseOnHover: true });

              const popupText = `
              <div class="map-popup-card">
                <div class="map-popup-header">
                  <span class="map-popup-title" title="${barco}">${barco}</span>
                  <span class="status-badge ${statusBadgeClass}">${estado}</span>
                </div>
                <div class="map-popup-item"><b>Lugar:</b> ${lugar}</div>
                <div class="map-popup-item"><b>Pax:</b> ${pax} &bull; <b>Maletas:</b> ${maletas} &bull; <b>Bolsos:</b> ${bolsos}</div>
                <div class="map-popup-time">${fecha}</div>
              </div>`;

              marker.bindPopup(popupText, { autoClose: false, closeOnClick: false, offset: [0, -16], minWidth: 200, maxWidth: 290 });
              marker.on('click', () => focusOnBoat(barco));
              markersGroup.addLayer(marker);
              markersMap[barco] = { marker: marker, lat: lat, lng: lng };
            }

            const card = document.createElement('div');
            card.className = 'boat-card';
            card.setAttribute('data-boat', barco);
            card.onclick = () => focusOnBoat(barco);
            const gpsIndicator = (lat !== null && lng !== null) ? '' : '<span style="color: #f59e0b; font-size: 0.75rem; margin-left: 6px;">📍 Sin GPS</span>';

            card.innerHTML = `
            <button class="btn-delete" onclick="eliminarBarcoEvent(event, '${barco}')" title="Eliminar registros">🗑️</button>
            <div class="boat-header">
              <span class="boat-title">${barco}</span>
              <span class="status-badge ${statusBadgeClass}">${estado}</span>
            </div>
            <div class="boat-place">Lugar: ${lugar}${gpsIndicator}</div>
            <div class="boat-info">
              <span><b>Pasajeros:</b> ${pax}</span>
              <span><b>Maletas:</b> ${maletas}</span>
              <span><b>Bolsos:</b> ${bolsos}</span>
            </div>
            <div class="boat-time">${fecha}</div>`;
            fleetListDiv.appendChild(card);
          });

          showAllBoats();
        },
        error: function (err) {
          console.error("Error cargando mapa:", err);
          if (btnRefresh) { btnRefresh.disabled = false; btnRefresh.innerHTML = '🔄 Actualizar Posiciones'; }
          showStatus("Error al cargar datos del mapa.", "error");
        }
      });
    }

    function focusOnBoat(barco) {
      if (!map) return;
      if (barco === 'ALL') { showAllBoats(); return; }

      const selectorElem = document.getElementById('mapBoatSelector');
      if (selectorElem) selectorElem.value = barco;

      document.querySelectorAll('.boat-card').forEach(c => c.classList.remove('active'));
      const targetCard = document.querySelector(`.boat-card[data-boat="${barco}"]`);
      if (targetCard) {
        targetCard.classList.add('active');
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      Object.keys(markersMap).forEach(key => {
        try { markersMap[key].marker.closePopup(); } catch (e) { }
      });

      if (markersMap[barco]) {
        const target = markersMap[barco];
        map.flyTo([target.lat, target.lng], 14, { duration: 1.0 });
        setTimeout(() => target.marker.openPopup(), 350);
        if (window.innerWidth < 768) { document.getElementById('map').scrollIntoView({ behavior: 'smooth' }); }
      } else {
        showStatus(`ℹ️ "${barco}" no tiene coordenadas GPS registradas.`, "info");
      }
    }

    function showAllBoats() {
      if (!map) return;

      const selectorElem = document.getElementById('mapBoatSelector');
      if (selectorElem) selectorElem.value = 'ALL';

      document.querySelectorAll('.boat-card').forEach(c => c.classList.remove('active'));

      const validMarkers = Object.keys(markersMap);
      validMarkers.forEach(key => { try { markersMap[key].marker.openPopup(); } catch (e) { } });

      if (markersGroup && validMarkers.length > 0) {
        try {
          const bounds = markersGroup.getBounds();
          if (bounds.isValid()) {
            if (validMarkers.length === 1) {
              const onlyTarget = markersMap[validMarkers[0]];
              map.flyTo([onlyTarget.lat, onlyTarget.lng], 13, { duration: 1.0 });
            } else {
              map.fitBounds(bounds.pad(0.2), { maxZoom: 14, padding: [50, 50], animate: true });
            }
          } else { map.setView([10.4000, -75.5300], 11); }
        } catch (e) { map.setView([10.4000, -75.5300], 11); }
      } else {
        map.setView([10.4000, -75.5300], 11);
      }
      updatePopupScale();
    }

    function onSelectBoatFilter(val) {
      if (val === 'ALL') { showAllBoats(); } else { focusOnBoat(val); }
    }
  </script>
